<!-- PRODUTOS -->

  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:25px;">

    <!-- ITEM -->

      <img src="https://tr.rbxcdn.com/heartblade.png" class="item-img">
      <h3>Heartblade</h3>
      <p class="raridade">Godly</p>
      <span class="preco">R$ 249,90</span>
      <button onclick="addToCart('Heartblade', 249.90)">Adicionar</button>

    <div class="card">
      <img src="https://tr.rbxcdn.com/sugar.png" class="item-img">
      <h3>Sugar</h3>
      <p class="raridade lend">Lendário</p>
      <span class="preco">R$ 159,90</span>
      <button onclick="addToCart('Sugar', 159.90)">Adicionar</button>
    </div>

    <div class="card">
      <img src="https://tr.rbxcdn.com/batwing.png" class="item-img">
      <h3>Batwing</h3>

      <button onclick="addToCart('Batwing', 219.90)">Adicionar</button>
    </div>

  </div>
